<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carta de Amor - Sahori & Daan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            color: #1a1a1a;
            font-family: 'Lora', serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header-font {
            font-family: 'Cinzel', serif;
        }

        .cursive-font {
            font-family: 'Great Vibes', cursive;
        }

        /* Container layout */
        .page-wrapper {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Left Floral Border Styling */
        .floral-border-left {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 220px;
            max-width: 32vw;
            pointer-events: none;
            z-index: 10;
        }

        /* Responsive adjustments for mobile screens */
        @media (max-width: 640px) {
            .floral-border-left {
                width: 110px;
                opacity: 0.95;
            }
        }
    </style>
</head>
<body class="bg-white">

    <div class="page-wrapper relative min-h-screen pt-4 sm:pt-6">

        <!-- Top Header Margin with Grayscale Lotus Flower -->
        <div class="w-full flex flex-col items-center justify-center z-20 mb-2">
            <!-- Grayscale Lotus Flower SVG Icon -->
            <svg class="w-10 h-10 sm:w-12 sm:h-12 drop-shadow-sm mb-1" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="lotusDark" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#52525b"/>
                        <stop offset="100%" stop-color="#18181b"/>
                    </linearGradient>
                    <linearGradient id="lotusLight" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="100%" stop-color="#a1a1aa"/>
                    </linearGradient>
                    <linearGradient id="lotusMid" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#d4d4d8"/>
                        <stop offset="100%" stop-color="#3f3f46"/>
                    </linearGradient>
                </defs>
                <!-- Outer Back Petals -->
                <path d="M50 75 C30 75 10 65 5 48 C20 48 35 55 50 75 Z" fill="url(#lotusDark)" stroke="#27272a" stroke-width="0.8"/>
                <path d="M50 75 C70 75 90 65 95 48 C80 48 65 55 50 75 Z" fill="url(#lotusDark)" stroke="#27272a" stroke-width="0.8"/>
                <!-- Side Petals -->
                <path d="M50 75 C25 70 12 50 20 32 C32 45 42 60 50 75 Z" fill="url(#lotusMid)" stroke="#3f3f46" stroke-width="0.8"/>
                <path d="M50 75 C75 70 88 50 80 32 C68 45 58 60 50 75 Z" fill="url(#lotusMid)" stroke="#3f3f46" stroke-width="0.8"/>
                <!-- Inner Mid Petals -->
                <path d="M50 75 C35 60 25 38 35 20 C45 35 48 55 50 75 Z" fill="url(#lotusLight)" stroke="#52525b" stroke-width="0.8"/>
                <path d="M50 75 C65 60 75 38 65 20 C55 35 52 55 50 75 Z" fill="url(#lotusLight)" stroke="#52525b" stroke-width="0.8"/>
                <!-- Center Main Petal -->
                <path d="M50 78 C42 58 40 30 50 12 C60 30 58 58 50 78 Z" fill="url(#lotusLight)" stroke="#71717a" stroke-width="0.8"/>
                <!-- Base Lotus Oval -->
                <ellipse cx="50" cy="76" rx="14" ry="3" fill="#18181b"/>
            </svg>

            <!-- Header Accent "Sahori & Daan" in clear Cinzel Typography -->
            <header class="w-full text-center">
                <h1 class="header-font text-zinc-900 text-2xl sm:text-3xl md:text-4xl font-medium tracking-widest uppercase select-none px-2">
                    Sahori &nbsp;&amp;&nbsp; Daan
                </h1>
            </header>
        </div>

        <!-- YouTube Audio Player Block with "Mrs Magic" -->
        <div class="z-30 my-2 px-2 w-full flex justify-center">
            <div class="bg-zinc-50/90 border border-zinc-200/80 rounded-full py-1.5 px-4 shadow-sm flex items-center justify-center gap-3 w-auto text-zinc-800">
                
                <!-- Play/Pause Interactive Button -->
                <button id="playBtn" onclick="togglePlay()" class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-zinc-900 hover:bg-zinc-700 text-white flex items-center justify-center transition-all transform hover:scale-105 active:scale-95 focus:outline-none shrink-0 cursor-pointer shadow-md" aria-label="Play or Pause">
                    <!-- Custom SVG Play Icon -->
                    <svg id="playIcon" class="w-5 h-5 sm:w-6 sm:h-6 fill-current ml-0.5" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <!-- Custom SVG Pause Icon -->
                    <svg id="pauseIcon" class="w-5 h-5 sm:w-6 sm:h-6 fill-current hidden" viewBox="0 0 24 24">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>

                <!-- Musical Decorative Icon and "Mrs Magic" Label -->
                <div class="flex items-center gap-1.5 select-none">
                    <svg class="w-4 h-4 text-zinc-700 fill-current opacity-80" viewBox="0 0 24 24">
                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                    </svg>
                    <span class="text-sm sm:text-base font-serif italic font-medium text-zinc-700 tracking-wide">
                        Mrs Magic
                    </span>
                </div>

                <!-- Hidden YouTube IFrame Player -->
                <div class="hidden">
                    <div id="yt-player"></div>
                </div>
            </div>
        </div>

        <script>
            var player;
            var isPlaying = false;

            // Load YouTube IFrame API asynchronously
            var tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            var firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

            function onYouTubeIframeAPIReady() {
                player = new YT.Player('yt-player', {
                    height: '0',
                    width: '0',
                    videoId: 'm4SyfrcsE0Q',
                    playerVars: {
                        'playsinline': 1,
                        'controls': 0,
                        'showinfo': 0,
                        'rel': 0
                    },
                    events: {
                        'onStateChange': onPlayerStateChange
                    }
                });
            }

            function togglePlay() {
                if (!player || typeof player.playVideo !== 'function') return;
                if (isPlaying) {
                    player.pauseVideo();
                } else {
                    player.playVideo();
                }
            }

            function onPlayerStateChange(event) {
                var playIcon = document.getElementById('playIcon');
                var pauseIcon = document.getElementById('pauseIcon');

                if (event.data == YT.PlayerState.PLAYING) {
                    isPlaying = true;
                    playIcon.classList.add('hidden');
                    pauseIcon.classList.remove('hidden');
                } else {
                    isPlaying = false;
                    playIcon.classList.remove('hidden');
                    pauseIcon.classList.add('hidden');
                }
            }
        </script>

        <!-- Left Floral Garland SVG in Grayscale/Monochrome -->
        <svg class="floral-border-left" viewBox="0 0 300 1000" preserveAspectRatio="xMinYMin slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="petalDark" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#27272a"/>
                    <stop offset="60%" stop-color="#52525b"/>
                    <stop offset="100%" stop-color="#71717a"/>
                </linearGradient>
                <linearGradient id="petalLight" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="50%" stop-color="#f4f4f5"/>
                    <stop offset="100%" stop-color="#a1a1aa"/>
                </linearGradient>
                <linearGradient id="petalMid" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#a1a1aa"/>
                    <stop offset="70%" stop-color="#52525b"/>
                    <stop offset="100%" stop-color="#27272a"/>
                </linearGradient>
                <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
                    <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
                </filter>
            </defs>

            <!-- GROUP OF FLOWERS - CASCADING DOWN THE LEFT SIDE -->
            
            <!-- 1. Top Small Blossoms Cluster -->
            <g transform="translate(-20, 10) scale(0.9)">
                <circle cx="80" cy="30" r="14" fill="url(#petalLight)" stroke="#3f3f46" stroke-width="0.8"/>
                <circle cx="110" cy="40" r="18" fill="url(#petalLight)" stroke="#3f3f46" stroke-width="0.8"/>
                <circle cx="60" cy="55" r="16" fill="url(#petalMid)" stroke="#27272a" stroke-width="0.8"/>
                <circle cx="95" cy="70" r="22" fill="url(#petalLight)" stroke="#3f3f46" stroke-width="0.8"/>
                <circle cx="130" cy="25" r="12" fill="url(#petalDark)" stroke="#18181b" stroke-width="0.8"/>
            </g>

            <!-- 2. Dark Hibiscus Top Flower -->
            <g transform="translate(10, 110) scale(1.1)">
                <path d="M50,40 Q20,10 50,-10 Q80,10 50,40 Z" fill="url(#petalDark)" stroke="#18181b"/>
                <path d="M50,40 Q10,30 0,60 Q20,90 50,40 Z" fill="url(#petalMid)" stroke="#18181b"/>
                <path d="M50,40 Q90,30 100,60 Q80,90 50,40 Z" fill="url(#petalDark)" stroke="#18181b"/>
                <path d="M50,40 Q20,80 50,100 Q80,80 50,40 Z" fill="url(#petalMid)" stroke="#18181b"/>
                <circle cx="50" cy="40" r="6" fill="#09090b"/>
            </g>

            <!-- 3. Bright White Hibiscus Flower -->
            <g transform="translate(0, 220) scale(1.2)">
                <path d="M60,50 Q10,10 40,-20 Q80,0 60,50 Z" fill="url(#petalLight)" stroke="#52525b" stroke-width="0.8"/>
                <path d="M60,50 Q0,40 -20,70 Q20,100 60,50 Z" fill="url(#petalLight)" stroke="#52525b" stroke-width="0.8"/>
                <path d="M60,50 Q100,20 120,60 Q90,100 60,50 Z" fill="url(#petalLight)" stroke="#71717a" stroke-width="0.8"/>
                <path d="M60,50 Q20,100 50,120 Q90,110 60,50 Z" fill="url(#petalLight)" stroke="#52525b" stroke-width="0.8"/>
                <path d="M60,50 Q90,30 110,25" stroke="#27272a" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="110" cy="25" r="3" fill="#18181b"/>
                <circle cx="105" cy="22" r="2" fill="#18181b"/>
            </g>

            <!-- 4. Large Detailed Lily Middle-Left -->
            <g transform="translate(-30, 420) scale(1.35)" filter="url(#shadow)">
                <path d="M80,80 Q20,30 10,70 Q40,110 80,80 Z" fill="url(#petalMid)" stroke="#27272a" stroke-width="0.8"/>
                <path d="M80,80 Q140,20 170,50 Q130,100 80,80 Z" fill="url(#petalLight)" stroke="#52525b" stroke-width="0.8"/>
                <path d="M80,80 Q110,150 70,160 Q40,130 80,80 Z" fill="url(#petalMid)" stroke="#27272a" stroke-width="0.8"/>
                <path d="M80,80 Q20,0 70,-20 Q100,30 80,80 Z" fill="url(#petalLight)" stroke="#71717a" stroke-width="0.8"/>
                <path d="M80,80 Q130,80 180,110 Q110,140 80,80 Z" fill="url(#petalLight)" stroke="#71717a" stroke-width="0.8"/>
                <path d="M80,80 Q10,100 -20,120 Q20,140 80,80 Z" fill="url(#petalLight)" stroke="#52525b" stroke-width="0.8"/>
                <path d="M80,80 Q100,50 115,40" stroke="#18181b" stroke-width="1.5" stroke-dasharray="2,2"/>
                <path d="M80,80 Q110,75 135,75" stroke="#18181b" stroke-width="1.5"/>
                <circle cx="135" cy="75" r="2.5" fill="#000000"/>
                <path d="M80,80 Q95,100 110,120" stroke="#18181b" stroke-width="1.5"/>
                <circle cx="110" cy="120" r="2.5" fill="#000000"/>
            </g>

            <!-- 5. Small Accents -->
            <g transform="translate(140, 580) scale(0.8)">
                <circle cx="30" cy="30" r="16" fill="url(#petalLight)" stroke="#71717a"/>
                <circle cx="65" cy="50" r="18" fill="url(#petalLight)" stroke="#71717a"/>
                <circle cx="100" cy="80" r="14" fill="url(#petalLight)" stroke="#71717a"/>
            </g>

            <!-- 6. Dark Bottom Hibiscus -->
            <g transform="translate(60, 700) scale(1.25)">
                <path d="M60,60 Q10,20 40,-10 Q90,10 60,60 Z" fill="url(#petalDark)" stroke="#18181b"/>
                <path d="M60,60 Q0,50 -20,80 Q30,110 60,60 Z" fill="url(#petalDark)" stroke="#18181b"/>
                <path d="M60,60 Q110,30 130,70 Q90,110 60,60 Z" fill="url(#petalMid)" stroke="#18181b"/>
                <path d="M60,60 Q20,110 60,130 Q100,110 60,60 Z" fill="url(#petalDark)" stroke="#18181b"/>
                <path d="M60,60 Q95,20 120,15" stroke="#e4e4e7" stroke-width="2"/>
                <circle cx="120" cy="15" r="3" fill="#ffffff"/>
            </g>

            <!-- 7. Large Bottom Left Base Flower -->
            <g transform="translate(-40, 780) scale(1.4)" filter="url(#shadow)">
                <path d="M70,70 Q20,20 50,-10 Q100,20 70,70 Z" fill="url(#petalLight)" stroke="#52525b" stroke-width="0.8"/>
                <path d="M70,70 Q0,60 -20,100 Q40,120 70,70 Z" fill="url(#petalLight)" stroke="#52525b" stroke-width="0.8"/>
                <path d="M70,70 Q120,40 140,80 Q100,120 70,70 Z" fill="url(#petalLight)" stroke="#71717a" stroke-width="0.8"/>
                <path d="M70,70 Q30,120 70,140 Q110,120 70,70 Z" fill="url(#petalLight)" stroke="#52525b" stroke-width="0.8"/>
                <path d="M70,70 Q40,110 30,125" stroke="#27272a" stroke-width="2"/>
                <circle cx="30" cy="125" r="3" fill="#18181b"/>
            </g>

            <!-- 8. Bottom Small Floral Base -->
            <g transform="translate(60, 900) scale(0.9)">
                <path d="M40,40 Q10,10 30,-10 Q60,10 40,40 Z" fill="url(#petalLight)" stroke="#3f3f46"/>
                <path d="M40,40 Q0,30 -10,50 Q20,70 40,40 Z" fill="url(#petalMid)" stroke="#27272a"/>
                <path d="M40,40 Q70,20 80,50 Q60,70 40,40 Z" fill="url(#petalLight)" stroke="#3f3f46"/>
                <path d="M40,40 Q20,70 40,80 Q60,70 40,40 Z" fill="url(#petalDark)" stroke="#18181b"/>
            </g>
        </svg>

        <!-- Content Area Positioned cleanly on the right side -->
        <main class="w-full max-w-2xl pl-28 pr-4 sm:pl-36 sm:pr-8 md:pl-56 md:pl-12 py-4 z-20 flex flex-col justify-start min-h-[70vh]">

</body>
